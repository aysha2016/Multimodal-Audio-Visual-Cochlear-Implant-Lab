<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CI-AI Research Lab - Multimodal Audio-Visual CI Processing</title>
    <meta name="description" content="Multimodal Audio-Visual Cochlear Implant Research Prototype for speech understanding in noise." />
    <meta property="og:title" content="CI-AI Research Lab - Multimodal Audio-Visual CI Processing" />
    <meta property="og:description" content="Combine visual speech cues with audio signals to improve speech understanding in noise." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Non-blocking asynchronous font loading with immediate system fallbacks -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
    </noscript>

    <style>
      /* Zero-delay instant system fallback typography */
      body {
        margin: 0;
        padding: 0;
        background-color: #F7F9FC;
        color: #0f172a;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      @keyframes fast-pulse {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.4; }
      }
      .skel-card {
        animation: fast-pulse 1.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
      }
    </style>
  </head>
  <body class="bg-[#F7F9FC] text-slate-900 m-0 p-0 antialiased font-sans">
    <div id="root">
      <!-- Instant Native Application Shell Skeleton: Renders in 0ms before React hydration -->
      <div style="min-height:100vh;display:flex;flex-direction:column;background:#F7F9FC;">
        <!-- Top App Bar -->
        <header style="height:64px;background:#ffffff;border-bottom:1px solid #e2e8f0;padding:0 24px;display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:36px;height:36px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;font-weight:800;font-size:16px;">CI</div>
            <div>
              <div style="font-weight:800;font-size:15px;color:#0f172a;letter-spacing:-0.02em;">CI-AI Research Lab</div>
              <div style="font-size:10px;color:#64748b;">Multimodal Audio-Visual Cochlear Implant Simulation</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="width:80px;height:28px;border-radius:6px;background:#f1f5f9;"></div>
            <div style="width:90px;height:28px;border-radius:6px;background:#4f46e5;opacity:0.8;"></div>
          </div>
        </header>

        <!-- Body Layout -->
        <div style="flex:1;display:flex;overflow:hidden;">
          <!-- Left Nav Skeleton (Desktop) -->
          <div style="width:230px;background:#ffffff;border-right:1px solid #e2e8f0;padding:16px;display:none;flex-direction:column;gap:8px;" class="hidden md:flex">
            <div class="skel-card" style="height:38px;border-radius:8px;background:#ede9fe;"></div>
            <div class="skel-card" style="height:38px;border-radius:8px;"></div>
            <div class="skel-card" style="height:38px;border-radius:8px;"></div>
            <div class="skel-card" style="height:38px;border-radius:8px;"></div>
          </div>

          <!-- Main Workspace Skeleton -->
          <div style="flex:1;padding:24px;display:flex;flex-direction:column;gap:16px;">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div class="skel-card" style="height:28px;width:260px;border-radius:6px;"></div>
              <div class="skel-card" style="height:28px;width:140px;border-radius:6px;"></div>
            </div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:16px;">
              <div class="skel-card" style="height:260px;border-radius:14px;background:#ffffff;"></div>
              <div class="skel-card" style="height:260px;border-radius:14px;background:#ffffff;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
